<div class="card cantina-card h-100 shadow-sm" (click)="vaiAlDettaglioCantina()">
  <div class="cantina-img-wrapper">
    <img
      [src]="immagineUrl"
      (error)="onImageError($event)"
      class="card-img-top img-fluid alcolico-img rounded-top"
      [alt]="cantina.nome">
  </div>

  <div class="card-body d-flex flex-column p-3">
    <h5 class="card-title fw-bold mb-2 cantina-nome text-truncate">
      {{ cantina.nome }}
    </h5>

    <hr class="mt-0 mb-2">

    <p class="card-text text-muted small text-description">
      {{ cantina.descrizione || 'Nessuna descrizione' }}
    </p>

    <div class="d-flex align-items-center mt-auto pt-2">
      <p class="card-text text-muted small mb-0 d-flex align-items-center gap-1 text-truncate">
        <mat-icon class="location-icon">place</mat-icon>
        <span>{{ cantina.posizione }}</span>
      </p>
    </div>
  </div>
</div>
