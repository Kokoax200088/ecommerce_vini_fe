<div class="card degustazione-card mb-4 shadow-sm" (click)="vaiAlDettaglio()">
  <img
    [src]="immagineUrl"
    (error)="onImageError($event)"
    class="card-img-top img-fluid degustazione-img rounded-top"
    [alt]="degustazione.nome">

  <div class="card-body d-flex flex-column p-3">
    <h5 class="card-title fw-bold mb-1 degustazione-nome text-truncate">
      {{ degustazione.nome }}
    </h5>

    <p class="card-text mb-2 text-muted degustazione-descrizione small">
      {{ degustazione.descrizione }}
    </p>

    <p class="card-text mb-2 text-muted degustazione-date small">
      <mat-icon class="align-middle" style="font-size: 16px; height: 16px; width: 16px;">event</mat-icon>
      {{ degustazione.dataInizio | date:'dd/MM/yyyy' }} - {{ degustazione.dataFine | date:'dd/MM/yyyy' }}
    </p>

    <p class="card-text mb-2 text-muted degustazione-alcolici small" *ngIf="degustazione.alcolici?.length">
      <mat-icon class="align-middle" style="font-size: 16px; height: 16px; width: 16px;">local_bar</mat-icon>
      {{ degustazione.alcolici.length }} alcolici inclusi
    </p>

    <div class="d-flex justify-content-between align-items-center mt-auto degustazione-footer">
      <p class="card-text m-0 fw-bold prezzo">
        {{ degustazione.prezzo | currency:'EUR' }}
      </p>
    </div>
  </div>
</div>
