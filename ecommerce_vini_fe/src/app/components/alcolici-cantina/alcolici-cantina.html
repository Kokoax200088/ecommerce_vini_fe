<div class="mt-4">
  <h3 class="section-title-underlined">I nostri alcolici</h3>

  <div class="mt-4 row g-3">
     @for (alcolicoCantina of listCantinaALcolico(); track alcolicoCantina.id) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
       <div class="card-badge-wrapper">
        @if(alcolicoCantina?.quantita > 0) {
    <div class="badge-quantita">
            x{{ alcolicoCantina?.quantita }}
          </div>
        }

          @if (alcolicoCantina?.quantita === 0) {
            <div class="overlay-esaurito d-flex align-items-center justify-content-center">
              <span>PRODOTTO ESAURITO</span>
            </div>
          }

    <app-alcolico-elimina [cantinaAlcolico]="alcolicoCantina" [idCantina]="idCantina"></app-alcolico-elimina>
    <app-alcolico-immagine [alcolico]="alcolicoCantina?.alcolico"></app-alcolico-immagine>

    <app-card-alcolico [alcolico]="alcolicoCantina?.alcolico"></app-card-alcolico>
@if(auth.grant().isCustomer && alcolicoCantina?.quantita > 0) {
<app-quantita-selector
              [quantitaMassima]="alcolicoCantina?.quantita ?? 1"
              (aggiungiCarrello)="onAggiungiCarrello(alcolicoCantina, $event)">
            </app-quantita-selector>
}
        </div>
        </div>
     }
  </div>

</div>
