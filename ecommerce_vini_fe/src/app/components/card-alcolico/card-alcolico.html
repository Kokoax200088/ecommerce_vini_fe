<div class="card alcolico-card mb-4 shadow-sm col-4"  (click)="vaiAlDettaglio()">
  <img
    [src]="immagineUrl"
    (error)="onImageError($event)"
    class="card-img-top img-fluid alcolico-img rounded-top"
    [alt]="alcolico.nome">

  <div class="card-body d-flex flex-column p-3">
    <h5 class="card-title fw-bold mb-1 alcolico-nome text-truncate">
      {{ alcolico.nome }}
    </h5>

    <p class="card-text mb-2 text-muted alcolico-meta small">
      {{ alcolico.tipologiaAlcolico?.nome }}  {{alcolico.colore?.nome}}• {{ alcolico.gradazione }}% vol
    </p>

    <div class="d-flex justify-content-between align-items-center mt-auto alcolico-footer">
      <p class="card-text m-0 fw-bold prezzo">
        {{ alcolico.prezzo | currency:'EUR' }}
      </p>
    </div>
  </div>
</div>
