<div class="card box-card mb-4 shadow-sm" (click)="clickDetail()">
    <img [src]="immagineUrl" (error)="onImageError($event)" class="card image-top img-fluid box-img rounded-top" [alt]="box.nome">
    
    <div class="card-body d-flex flex-column p-3">
        <h5 class="card-title fw-bold mb-1 alcolico-nome text-truncate">
            {{box.nome}}
        </h5>

        <p class="card-text mb-2 text-muted box-meta small">
            Sconto: {{box.sconto}} %
        </p>

        <div class="d-flex justify-content-between align-items-center mt-auto alcolico-footer">
            <p class="card-text m-0 fw-bold prezzo">
                Clicca per maggiori informazioni
            </p>
        </div>
    </div>
</div>
