<div class="search-bar-wrapper">
  <mat-icon class="search-icon">search</mat-icon>
  
  <input
    type="text"
    class="search-input"
    placeholder="Cerca..."
    [(ngModel)]="query"
    (ngModelChange)="onInput()">

  <!-- Bottone per cancellare il testo inserito -->
  <button 
    *ngIf="query" 
    type="button" 
    class="clear-button" 
    (click)="query = ''; onInput()" 
    aria-label="Cancella ricerca">
    <mat-icon>close</mat-icon>
  </button>
</div>
