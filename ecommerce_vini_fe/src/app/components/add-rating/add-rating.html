<form [formGroup]="ratingForm" (ngSubmit)="onSubmit()" class="rating-form">
  <mat-form-field appearance="outline">
    <mat-label>Valutazione (1-5)</mat-label>
    <input matInput type="number" formControlName="valutazione" min="1" max="5" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Commento</mat-label>
    <textarea matInput formControlName="commento" rows="3"></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="ratingForm.invalid">
    Invia recensione
  </button>
</form>
