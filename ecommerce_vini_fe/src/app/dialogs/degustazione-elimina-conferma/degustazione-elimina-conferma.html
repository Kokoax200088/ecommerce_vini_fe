<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">
    <mat-icon class="icon-danger me-2">warning</mat-icon>
    Eliminazione degustazione
  </h2>

  <mat-dialog-content class="dialog-content">
    <p class="mb-0">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary px-3" (click)="close()">
      Annulla
    </button>
    <button type="button" class="btn btn-sm btn-outline-danger px-3 d-flex align-items-center gap-1" (click)="onDelete()">
      <mat-icon class="icon-sm">delete</mat-icon>
      Conferma
    </button>
  </mat-dialog-actions>
</div>
