<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Alcolici</h2>
    <button mat-icon-button
            color="primary"
            (click)="navigateListAlcolici()"
            aria-label="Vai alla lista completa">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

  <div class="card alcolico-card mb-2 col-7">
  <div class="row g-0">
    <div class="col-4">
      <img
        src="/placeholder.png"
        class="img-fluid rounded-start alcolico-img"
        alt="Chianti Classico">
    </div>
    <div class="col-8">
      <div class="card-body d-flex flex-column h-100">
        <div class="d-flex justify-content-between align-items-start">
          <h5 class="card-title fw-bold mb-1">Chianti Classico</h5>
          <button class="btn btn-sm btn-outline-primary" aria-label="Vai al dettaglio">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
        <p class="card-text mb-1"><span class="text-muted">Tipologia:</span> Vino rosso</p>
        <p class="card-text mb-1"><span class="text-muted">Gradazione:</span> 13%</p>
        <p class="card-text mt-auto fw-bold prezzo">18,50 €</p>
      </div>
    </div>
  </div>
</div>

    <div class="card alcolico-card col-7 mb-4">
      <div class="row g-0">
        <div class="col-4">
  <img

        alt="Chianti Classico">
    </div>
        <div class="col-8">
          <div class="card-body d-flex flex-column h-100">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title fw-bold mb-1">Prosecco extra dry</h5>
              <button mat-icon-button
            color="primary"
            aria-label="Vai alla lista completa">
      <mat-icon>arrow_forward</mat-icon>
    </button>
            </div>

            <p class="card-text mt-auto fw-bold prezzo">9,90 €</p>
          </div>
        </div>
      </div>
    </div>
