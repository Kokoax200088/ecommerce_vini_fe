<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Alcolici</h2>
    <button mat-icon-button
            color="primary"
            (click)="navigateListAlcolici()"
            aria-label="Vai alla lista completa">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
<div class="row g-3">
    @for (alcolico of alcolici().slice(0, 6); track alcolico.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <app-card-alcolico [alcolico]="alcolico"></app-card-alcolico>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-muted">Nessun alcolico disponibile al momento.</p>
      </div>
    }
  </div>
  
  <hr class="my-4">

  <!-- SEZIONE CATALOGO CANTINE -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Cantine</h2>
    <button mat-icon-button
            color="primary"
            (click)="navigateListCantine()"
            aria-label="Vai alla lista completa cantine">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
<div class="row g-3">
    @for (cantina of cantine().slice(0, 6); track cantina.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <app-card-cantina [cantina]="cantina"></app-card-cantina>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-muted">Nessuna cantina disponibile al momento.</p>
      </div>
    }
  </div>
</div>
