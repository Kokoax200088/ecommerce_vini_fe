<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Alcolici</h2>
    <button mat-icon-button
            color="primary"
            (click)="navigateListAlcolici()"
            aria-label="Vai alla lista completa">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

    @for (alcolico of alcolici().slice(0, 3); track alcolico.id) {
      <div class="col-12 col-md-6 mb-3">
        <app-card-alcolico [alcolico]="alcolico"></app-card-alcolico>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-muted">Nessun alcolico disponibile al momento.</p>
      </div>
    }
  
  <hr class="my-4">

  <!-- SEZIONE CATALOGO CANTINE -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Cantine</h2>
    <button mat-icon-button
            color="primary"
            (click)="navigateListCantine()"
            aria-label="Vai alla lista completa cantine">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

  <!-- Card Cantina 1 -->
  <div class="card cantina-card mb-2 col-7">
    <div class="row g-0">
      <div class="col-4">
        <img
          src="image-cantina.png"
          class="img-fluid rounded-start cantina-img"
          alt="Cantina Antinori">
      </div>
      <div class="col-8">
        <div class="card-body d-flex flex-column h-100">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title fw-bold mb-1">Cantina Antinori</h5>
            <button mat-icon-button
                    color="primary"
                    aria-label="Dettaglio Cantina Antinori">
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </div>
          <p class="card-text mt-auto mb-1">
            <span class="text-muted">Posizione:</span> Toscana, Italia
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Card Cantina 2 -->
  <div class="card cantina-card col-7 mb-4">
    <div class="row g-0">
      <div class="col-4">
        <img
          src="image-cantina.png"
          class="img-fluid rounded-start cantina-img"
          alt="Tenuta San Guido">
      </div>
      <div class="col-8">
        <div class="card-body d-flex flex-column h-100">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title fw-bold mb-1">Tenuta San Guido</h5>
            <button mat-icon-button
                    color="primary"
                    aria-label="Dettaglio Tenuta San Guido">
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </div>
          <p class="card-text mt-auto mb-1">
            <span class="text-muted">Posizione:</span> Bolgheri, Italia
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
