<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header class="register-header">
      <mat-card-title>Crea il tuo Account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="utenteForm" (ngSubmit)="onSubmit()" class="form-grid">
        
        <mat-form-field appearance="outline" class="col-half">
          <mat-label>Nome</mat-label>
          <input matInput type="text" formControlName="nome">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-half">
          <mat-label>Cognome</mat-label>
          <input matInput type="text" formControlName="cognome">
          <mat-icon matSuffix>person_outline</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="esempio@email.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-half">
          <mat-label>Data di nascita</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dataNascita">
          <mat-hint>GG/MM/AAAA</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-half">
          <mat-label>Scegli ruolo</mat-label>
          <mat-select formControlName="ruolo">
            <mat-option [value]="1">Cliente</mat-option>
            <mat-option [value]="3">Venditore</mat-option>
          </mat-select>
        </mat-form-field>

        @if (utenteForm.get('ruolo')?.value === 1) {
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Indirizzo di Spedizione</mat-label>
            <input matInput type="text" formControlName="indirizzo">
            <mat-icon matSuffix>home</mat-icon>
          </mat-form-field>
        }

        @if (utenteForm.get('ruolo')?.value === 3) {
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Partita IVA</mat-label>
            <input matInput type="text" formControlName="partitaIva">
            <mat-icon matSuffix>business</mat-icon>
          </mat-form-field>
        }

        <div class="form-actions full-width">
          <button mat-flat-button class="btn-submit" type="submit" [disabled]="!utenteForm.valid">
            Registrati
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
