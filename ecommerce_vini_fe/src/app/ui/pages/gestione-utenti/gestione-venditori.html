<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Gestione Utenti</h2>
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>

  <app-table-generic
    [columns]="colonneUtenti"
    [data]="utenti()">
    <ng-template #actionsTpl let-row>
      <small>Loggato: {{ loggedUtente()?.id }} | Row: {{ row.id }}</small>
      @if(loggedUtente()?.id != row.id){
      <button class="btn btn-sm btn-outline-danger" (click)="onDelete(row, row.ruolo)">
        <mat-icon>delete</mat-icon>
      </button>
    }
    </ng-template>
  </app-table-generic>
</div>
