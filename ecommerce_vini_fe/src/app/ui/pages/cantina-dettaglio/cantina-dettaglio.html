<div class="container mt-4">

      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </div>

    <div class="cantina-hero-container shadow-sm">
      <img [src]="immagineUrl" (error)="onImageError($event)" class="cantina-hero-img" [alt]="cantina?.nome">
      <div class="cantina-hero-overlay"></div>
      <div class="cantina-hero-title-block">
        <h1 class="cantina-title-overlay">{{ cantina?.nome }}</h1>
      </div>
    </div>

    <div class="mt-4 d-flex align-items-center gap-2">
      <mat-icon class="location-icon">place</mat-icon>
      <p class="mb-0">{{ cantina?.posizione }}</p>
    </div>
    @if(cantina?.listCantinaAlcolico && cantina?.listCantinaAlcolico.length > 0) {
    <app-alcolici-cantina [idCantina]="cantina?.id"></app-alcolici-cantina>
    }

    @if(cantina?.listBox && cantina?.listBox.length > 0) {
    <app-box-cantina></app-box-cantina>
    }
    @if(cantina?.listDegustazione && cantina?.listDegustazione.length > 0) {
    <app-degustazioni-cantina></app-degustazioni-cantina>
    }


</div>
