<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <mat-form-field class="form-col">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email">
  </mat-form-field>

  <mat-form-field class="form-col">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password">
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">Login</button>
    <!--<button mat-raised-button color="primary" type="button" (click)="onResendChange()">Password dimenticata?</button>-->
    <button class="btn btn-light" type="button" (click)="registrazione()">Registrazione</button>   
</form>
