<h3>Elenco ordini</h3>

<button mat-raised-button color="primary" (click)="onCreateOrdine()">
  <mat-icon>add</mat-icon>
  Nuovo ordine
</button>

<mat-list>
  @for ( ordine of ordini(); track ordine.id) {
    <mat-list-item lines="3" (click)="onSelected(ordine)">
      <span matListItemTitle>Ordine #{{ ordine.id }} - {{ ordine.utente}}</span>
      <span matListItemLine>Stato: {{ ordine.status}}</span>
      <span matListItemLine>
        Data: {{ ordine.data_ordine }} - Totale: {{ ordine.totale | currency:'EUR' }} -
        Consegna: {{ ordine.indirizzo_destinazione }}
      </span>
    </mat-list-item>
  } @empty {
    <mat-list-item>Nessun ordine disponibile</mat-list-item>
  }
</mat-list>
