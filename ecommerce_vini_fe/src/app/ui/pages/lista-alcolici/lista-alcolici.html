<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Alcolici</h2>
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>

  @if (msgErrore()) {
    <p class="messaggio-errore">{{ msgErrore() }}</p>
  }
<div class="row g-3">
    @for (alcolico of alcolici(); track alcolico.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card-wrapper-eliminabile">
          <button
            type="button"
            class="bottone-elimina"
            [class.d-none]="!auth.grant().isSeller"
            (click)="chiediConferma(alcolico.id)"
            aria-label="Elimina alcolico">
            <mat-icon class="icona-elimina">close</mat-icon>
          </button>

          @if (idInEliminazione() === alcolico.id) {
            <div class="overlay-conferma d-flex flex-column align-items-center justify-content-center">
              <p class="testo-conferma">Eliminare questo alcolico?</p>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm bottone-conferma" (click)="elimina(alcolico.id)">Elimina</button>
                <button type="button" class="btn btn-sm btn-light" (click)="annullaEliminazione()">Annulla</button>
              </div>
            </div>
          }

          <app-card-alcolico [alcolico]="alcolico"></app-card-alcolico>
        </div>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-muted">Nessun alcolico disponibile al momento.</p>
      </div>
    }
  </div>
</div>
