<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Catalogo Alcolici</h2>
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>
<div class="row g-3">
    @for (alcolico of alcolici(); track alcolico.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <app-card-alcolico [alcolico]="alcolico"></app-card-alcolico>
      </div>
    } @empty {
      <div class="col-12">
        <p class="text-muted">Nessun alcolico disponibile al momento.</p>
      </div>
    }
  </div>
</div>
