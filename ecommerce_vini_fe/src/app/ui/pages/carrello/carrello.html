@if ((cart()?.listaProdotti?.length ?? 0) > 0 || 
     (cart()?.listaBox?.length ?? 0) > 0 || 
     (cart()?.listaDegustazione?.length ?? 0) > 0) {

  <div class="container mt-4">
    <div class="row mb-4">
      <div class="col">
        <div class="carrello-header">
          <h1>Il mio carrello</h1>
          <span class="badge-quantita">{{ quantitaTotale() }} {{ quantitaTotale() === 1 ? 'articolo' : 'articoli' }}</span>
        </div>

        <app-prodotto-alcolico [listProdottoAlcolico]="cart()?.listaProdotti ?? []" [idCart]="cart()!.id"></app-prodotto-alcolico>

        <div class="riepilogo-prezzo">
          <span class="riepilogo-label">Totale</span>
          <span class="riepilogo-prezzo-valore">{{ prezzoTotale() | currency:'EUR' }}</span>
        </div>

        <div class="text-center mt-4 mb-4">
          <button type="button" class="btn-checkout" (click)="procediOrdine()">
            Procedi con l'ordine
          </button>
        </div>
      </div>
    </div>
  </div>

} @else {

  <div class="d-flex flex-column align-items-center justify-content-center text-center h-100 py-5">
    <img src="cart_empty_image.png" alt="Carrello Vuoto" class="immagine-not-found mb-4" />
  </div>

}
